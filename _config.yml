  location         : "Tianjin, P. R. China"
  employer         : # Department removed (redundant with bio)
  uri              : # URL
  email            : "huangwenhua66@icloud.com"

  # Academic websites
  academia         : # URL
  arxiv            : # URL - Update with the correct link to your profile
  googlescholar    : # URL
  inspire-hep      : # URL
  impactstory      : # URL
